<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Scorecard — Privacy Policy</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1a1a2e; line-height: 1.6; }
        a { color: inherit; text-decoration: none; }
        /* Header */
        .site-header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.92); backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px); border-bottom: 1px solid #E9ECEF; }
        .header-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; }
        .header-brand { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .header-brand img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; }
        .header-brand span { font-size: 17px; font-weight: 600; color: #1a1a2e; letter-spacing: -0.3px; }
        /* Language switcher */
        .lang-switcher { display: flex; gap: 4px; align-items: center; }
        .lang-btn { background: none; border: none; cursor: pointer; font-size: 0.875rem; font-family: inherit; color: #6C757D; padding: 4px 6px; border-radius: 4px; transition: color 0.15s, background 0.15s; }
        .lang-btn:hover { background: #F8F9FA; color: #1A1A2E; }
        .lang-btn.active { color: #2D6A4F; font-weight: 600; }
        .lang-sep { color: #DEE2E6; font-size: 0.875rem; user-select: none; }
        /* Content */
        .content { max-width: 720px; margin: 0 auto; padding: 24px; }
        h1 { color: #2D6A4F; }
        h2 { color: #40916C; margin-top: 2em; }
        h3 { color: #1a1a2e; margin-top: 1.5em; }
        p { margin: 0.8em 0; }
        ul { margin: 0.8em 0; padding-left: 1.5em; }
        .date { color: #6c757d; }
        table { border-collapse: collapse; width: 100%; margin: 1em 0; }
        th, td { border: 1px solid #dee2e6; padding: 8px 12px; text-align: left; }
        th { background: #f8f9fa; }
        /* Footer */
        .site-footer { border-top: 1px solid #E9ECEF; padding: 24px; text-align: center; margin-top: 3em; }
        .site-footer a { color: #6c757d; text-decoration: none; font-size: 0.875rem; margin: 0 12px; }
        .site-footer a:hover { color: #2D6A4F; }
        .footer-copy { font-size: 0.875rem; color: #6c757d; margin-top: 8px; }
    </style>
</head>
<body>
    <!-- Header with logo and language switcher -->
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="header-brand">
                <img src="/icon.png" alt="Golf Scorecard icon" />
                <span>Golf Scorecard</span>
            </a>
            <div class="lang-switcher">
                <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
                <span class="lang-sep">|</span>
                <button class="lang-btn" id="btn-ru" onclick="setLang('ru')">RU</button>
            </div>
        </div>
    </header>

    <div class="content">
        <h1 data-en="Privacy Policy"
            data-ru="Политика конфиденциальности"></h1>
        <p class="date"
           data-en="Last updated: June 12, 2026"
           data-ru="Последнее обновление: 12 июня 2026"></p>

        <h2 data-en="Overview"
            data-ru="Обзор"></h2>
        <p data-en='Golf Scorecard ("the App") is a mobile application for tracking golf scores, developed by DNTSK. We respect your privacy and are committed to protecting your personal data. This policy describes what data is collected, how it is used, and your rights regarding that data.'
           data-ru='Golf Scorecard («Приложение») — мобильное приложение для ведения счёта в гольфе, разработанное DNTSK. Мы уважаем вашу конфиденциальность и стремимся защитить ваши персональные данные. Эта политика описывает, какие данные собираются, как они используются и какие у вас есть права.'></p>

        <h2 data-en="Data Stored on Your Device"
            data-ru="Данные на вашем устройстве"></h2>
        <p data-en="The App stores your scorecard data locally on your device. Golf scorecard data is not sent automatically to DNTSK servers."
           data-ru="Приложение хранит данные вашей карточки счёта локально на устройстве. Данные карточки счёта не отправляются автоматически на серверы DNTSK."></p>
        <!-- This paragraph uses innerHTML for the <strong> tag -->
        <p class="i18n-html"
           data-en="<strong>DNTSK does not provide account sync or cloud scorecard storage.</strong> The following scorecard and app data is stored on your device:"
           data-ru="<strong>DNTSK не предоставляет синхронизацию аккаунта или облачное хранение карточек счёта.</strong> На вашем устройстве хранятся следующие данные карточки и приложения:"></p>
        <ul>
            <li data-en="Golf round data (dates, scores, hole pars)"
                data-ru="Данные раундов (даты, счёт, par лунок)"></li>
            <li data-en="Player names"
                data-ru="Имена игроков"></li>
            <li data-en="Course names"
                data-ru="Названия полей"></li>
            <li data-en="App preferences (language setting)"
                data-ru="Настройки приложения (язык)"></li>
        </ul>
        <p data-en="Deleting the App will permanently remove locally stored scorecard data unless you created a backup or exported it to a destination you selected."
           data-ru="Удаление приложения безвозвратно удалит локально сохранённые данные карточек, если вы не создали резервную копию или не экспортировали их в выбранное вами место."></p>

        <h2 data-en="Backups and User-Initiated Export"
            data-ru="Резервные копии и экспорт по инициативе пользователя"></h2>
        <p data-en="The App may let you export a local JSON backup through the iOS share sheet. Export starts only when you choose to share the backup."
           data-ru="Приложение может позволять экспортировать локальную резервную копию JSON через iOS share sheet. Экспорт начинается только когда вы сами выбираете отправить резервную копию."></p>
        <p data-en="When you select a destination app or service in the share sheet, that destination may receive and process the exported file under its own terms and privacy policy. DNTSK does not control those destinations."
           data-ru="Когда вы выбираете приложение или сервис назначения в share sheet, этот получатель может получить и обработать экспортированный файл согласно своим условиям и политике конфиденциальности. DNTSK не контролирует такие места назначения."></p>

        <h2 data-en="Purchases and Subscriptions"
            data-ru="Покупки и подписки"></h2>
        <p data-en="Golf Scorecard PRO purchases and subscriptions are processed by Apple through the App Store. Apple may process your Apple ID, payment, transaction, and subscription information according to Apple's privacy policy and App Store terms."
           data-ru="Покупки и подписки Golf Scorecard PRO обрабатываются Apple через App Store. Apple может обрабатывать ваш Apple ID, платёжные данные, транзакции и информацию о подписке согласно политике конфиденциальности Apple и условиям App Store."></p>
        <p data-en="The App receives purchase entitlement or subscription status needed to unlock PRO features. DNTSK does not receive your full payment card details."
           data-ru="Приложение получает статус покупки или подписки, необходимый для разблокировки PRO-функций. DNTSK не получает полные данные вашей платёжной карты."></p>

        <h2 data-en="Advertising and Promotions"
            data-ru="Реклама и промо"></h2>
        <p data-en="The App may display first-party promotional messages configured by DNTSK. These promotions are rendered by the App itself and do not use third-party advertising SDKs."
           data-ru="Приложение может показывать собственные промо-сообщения, настроенные DNTSK. Эти промо отображаются самим приложением и не используют сторонние рекламные SDK."></p>
        <!-- This paragraph uses innerHTML for the <strong> tag -->
        <p class="i18n-html"
           data-en="<strong>We do not collect advertising identifiers, request App Tracking Transparency permission, or share your personal data with ad networks.</strong>"
           data-ru="<strong>Мы не собираем рекламные идентификаторы, не запрашиваем разрешение App Tracking Transparency и не передаём персональные данные рекламным сетям.</strong>"></p>
        <p data-en="First-party promotional links may open external websites or apps when you choose to open them. Those destinations may process data according to their own privacy policies."
           data-ru="Собственные промо-ссылки могут открывать внешние сайты или приложения, если вы решите перейти по ним. Такие места назначения могут обрабатывать данные согласно своим политикам конфиденциальности."></p>

        <h2 data-en="GDPR (European Economic Area, UK, Switzerland)"
            data-ru="GDPR (Европейская экономическая зона, Великобритания, Швейцария)"></h2>
        <p data-en="If you are located in the EEA, UK, or Switzerland, you have the following rights under the General Data Protection Regulation:"
           data-ru="Если вы находитесь в ЕЭЗ, Великобритании или Швейцарии, у вас есть следующие права в рамках GDPR:"></p>
        <ul>
            <!-- Each list item uses innerHTML for the <strong> tag -->
            <li class="i18n-html"
                data-en="<strong>Right to access</strong> — request what data is held about you"
                data-ru="<strong>Право на доступ</strong> — запросить, какие данные о вас хранятся"></li>
            <li class="i18n-html"
                data-en="<strong>Right to deletion</strong> — request deletion of your data"
                data-ru="<strong>Право на удаление</strong> — запросить удаление ваших данных"></li>
            <li class="i18n-html"
                data-en="<strong>Right to object</strong> — object to applicable data processing"
                data-ru="<strong>Право на возражение</strong> — возразить против применимой обработки данных"></li>
            <li class="i18n-html"
                data-en="<strong>Right to withdraw consent</strong> — withdraw previously given consent at any time"
                data-ru="<strong>Право на отзыв согласия</strong> — отозвать ранее данное согласие в любое время"></li>
        </ul>
        <p data-en="Because scorecard data is stored locally and is not sent automatically to DNTSK servers, most privacy requests can be fulfilled by deleting data inside the App or uninstalling it. You can still contact us if you need assistance."
           data-ru="Поскольку данные карточек счёта хранятся локально и не отправляются автоматически на серверы DNTSK, большинство запросов можно выполнить, удалив данные внутри приложения или удалив приложение. Вы также можете связаться с нами, если нужна помощь."></p>

        <h2 data-en="CCPA (California, USA)"
            data-ru="CCPA (Калифорния, США)"></h2>
        <p data-en="If you are a California resident, the California Consumer Privacy Act (CCPA) provides you with the right to:"
           data-ru="Если вы являетесь резидентом Калифорнии, Закон о защите прав потребителей Калифорнии (CCPA) предоставляет вам право:"></p>
        <ul>
            <li data-en="Know what personal information is collected"
                data-ru="Знать, какая персональная информация собирается"></li>
            <li data-en="Request deletion of your personal information"
                data-ru="Запросить удаление вашей персональной информации"></li>
            <li data-en="Opt out of the sale of personal information"
                data-ru="Отказаться от продажи персональной информации"></li>
        </ul>
        <p data-en='The App does not sell personal information and does not share personal information for cross-context behavioral advertising.'
           data-ru='Приложение не продаёт персональную информацию и не передаёт персональную информацию для кросс-контекстной поведенческой рекламы.'></p>

        <h2 data-en="Data Retention"
            data-ru="Хранение данных"></h2>
        <p data-en="Local data on your device is retained until you delete it or uninstall the App. The App does not store your golf data on DNTSK servers."
           data-ru="Локальные данные на вашем устройстве хранятся, пока вы их не удалите или не удалите приложение. Приложение не хранит ваши данные о гольфе на серверах DNTSK."></p>

        <h2 data-en="Children's Privacy"
            data-ru="Конфиденциальность детей"></h2>
        <p data-en="The App is not directed at children under the age of 13 (or under 16 in the EEA). We do not knowingly collect personal information from children. If you believe a child has provided personal information, please contact us."
           data-ru="Приложение не предназначено для детей младше 13 лет (или младше 16 в ЕЭЗ). Мы сознательно не собираем персональную информацию детей. Если вы считаете, что ребёнок предоставил персональную информацию, свяжитесь с нами."></p>

        <h2 data-en="Changes to This Policy"
            data-ru="Изменения в политике"></h2>
        <p data-en='We may update this Privacy Policy from time to time. Changes will be reflected on this page with an updated "Last updated" date. Continued use of the App after changes constitutes acceptance of the updated policy.'
           data-ru="Мы можем обновлять эту Политику конфиденциальности время от времени. Изменения будут отражены на этой странице с обновлённой датой. Продолжение использования приложения после изменений означает принятие обновлённой политики."></p>

        <h2 data-en="Contact"
            data-ru="Контакты"></h2>
        <p data-en="If you have questions about this Privacy Policy or wish to exercise your data rights, contact us at:"
           data-ru="Если у вас есть вопросы об этой Политике конфиденциальности или вы хотите реализовать свои права, свяжитесь с нами:"></p>
        <p>Email: <a href="mailto:info@dntsk.dev">info@dntsk.dev</a></p>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div>
            <a href="/"
               data-en="Home"
               data-ru="Главная"></a>
            <a href="/support/"
               data-en="Support"
               data-ru="Поддержка"></a>
            <a href="/terms/"
               data-en="Terms of Use"
               data-ru="Условия использования"></a>
        </div>
        <p class="footer-copy">© 2026 Golf Scorecard</p>
    </footer>

    <script>
        // Supported languages
        var LANGS = ['en', 'ru'];
        var DEFAULT_LANG = 'en';

        // Apply language to all translatable elements
        function applyLang(lang) {
            // Plain text elements
            var els = document.querySelectorAll('[data-en]');
            els.forEach(function(el) {
                var text = el.getAttribute('data-' + lang);
                if (!text) return;
                // Use innerHTML for elements that contain markup
                if (el.classList.contains('i18n-html')) {
                    el.innerHTML = text;
                } else {
                    el.textContent = text;
                }
            });

            // Update active button state
            LANGS.forEach(function(l) {
                var btn = document.getElementById('btn-' + l);
                if (btn) btn.classList.toggle('active', l === lang);
            });

            // Update html lang attribute for accessibility
            document.documentElement.lang = lang;
        }

        // Set language and persist to localStorage
        function setLang(lang) {
            if (LANGS.indexOf(lang) === -1) return;
            localStorage.setItem('gs_lang', lang);
            applyLang(lang);
        }

        // Detect language: localStorage > navigator.language > default
        function detectLang() {
            var saved = localStorage.getItem('gs_lang');
            if (saved && LANGS.indexOf(saved) !== -1) return saved;
            var nav = (navigator.language || '').toLowerCase();
            if (nav.startsWith('ru')) return 'ru';
            return DEFAULT_LANG;
        }

        // Initialise on page load
        (function() {
            applyLang(detectLang());
        })();
    </script>
</body>
</html>
